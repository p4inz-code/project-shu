<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" width="900" height="1125">
  <defs>
    <linearGradient id="bg-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffaf6" />
      <stop offset="55%" stop-color="#f7e3f0" />
      <stop offset="100%" stop-color="#fde2d2" />
    </linearGradient>
    <radialGradient id="glow-3" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#e8a87c" stop-opacity="0.42" />
      <stop offset="55%" stop-color="#a85d74" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#fffaf6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg-3)" />
  <rect width="100%" height="100%" fill="url(#glow-3)" />

  <!-- Delicate frame lines -->
  <rect x="34" y="34" width="832" height="1057" rx="12" fill="none" stroke="#a85d74" stroke-opacity="0.32" stroke-width="1.3" />
  <rect x="50" y="50" width="800" height="1025" rx="8" fill="none" stroke="#2a1621" stroke-opacity="0.12" stroke-width="1" />

  <!-- Top metadata strip -->
  <text x="68" y="82" fill="#a85d74" font-family="monospace" font-size="13" letter-spacing="3" opacity="0.82">
    PLATE 04 // GOLDEN DAYLIGHT
  </text>
  <text x="832" y="82" text-anchor="end" fill="#a85d74" font-family="monospace" font-size="13" letter-spacing="2" opacity="0.72">
    SHU KEEPSAKE • 04
  </text>

  <!-- Subtle orbital crosshairs -->
  <line x1="188" y1="473" x2="712" y2="473" stroke="#a85d74" stroke-opacity="0.2" stroke-width="1" />
  <line x1="450" y1="211" x2="450" y2="735" stroke="#a85d74" stroke-opacity="0.2" stroke-width="1" />

  <!-- Lunar / Solar halo rings -->
  <circle cx="450" cy="473" r="207" fill="none" stroke="#a85d74" stroke-opacity="0.38" stroke-width="1.3" stroke-dasharray="5 7" />
  <circle cx="450" cy="473" r="149" fill="none" stroke="#2a1621" stroke-opacity="0.26" stroke-width="1.1" />
  <circle cx="450" cy="473" r="91" fill="#e8a87c" fill-opacity="0.22" stroke="#a85d74" stroke-opacity="0.52" stroke-width="1.4" />

  <!-- Center focal emblem (Heart + Lunar/Solar motif) -->
  <path d="M 450 499
           C 444 493, 416 471, 416 453
           C 416 439, 428 431, 440 431
           C 448 431, 454 437, 450 444
           C 446 437, 452 431, 460 431
           C 472 431, 484 439, 484 453
           C 484 471, 456 493, 450 499 Z"
        fill="#e8a87c" fill-opacity="0.28" stroke="#2a1621" stroke-opacity="0.78" stroke-width="1.6" />

  <!-- Editorial title lockup -->
  <text x="450" y="799" text-anchor="middle" fill="#2a1621" font-family="Georgia, 'Times New Roman', serif" font-size="29" letter-spacing="4" opacity="0.95">
    SIMPLY SHU IN SUNLIGHT
  </text>
  <text x="450" y="861" text-anchor="middle" fill="#a85d74" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="20" opacity="0.9">
    Warmth that fills the room — reserved for a solo portrait of Shu
  </text>
  <text x="450" y="939" text-anchor="middle" fill="#2a1621" font-family="monospace" font-size="14" letter-spacing="1.5" opacity="0.68">
    Drop memory-04.jpg in private-content/photos/
  </text>
  <text x="450" y="996" text-anchor="middle" fill="#a85d74" font-family="sans-serif" font-size="12" letter-spacing="3" opacity="0.58">
    MOONLIGHT × SUNSHINE EDITION • FOR YASHVI POKAR
  </text>
</svg>